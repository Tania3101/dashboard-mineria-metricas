<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard: Minería y Métricas de Repositorios</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ============================================= -->
    <!-- ENCABEZADO: el titulo principal de la pagina   -->
    <!-- ============================================= -->
    <header class="encabezado">
        <h1>Catálogo de Repositorios</h1>
        <p class="subtitulo">Minería de código fuente + Extracción de métricas</p>
    </header>

    <!-- ============================================= -->
    <!-- CONTENIDO PRINCIPAL: aqui van las 2 secciones -->
    <!-- ============================================= -->
    <main class="contenedor-principal">

        <!-- ---------------------------------------------- -->
        <!-- SECCION DE EBER (Minería) - el la va a llenar  -->
        <!-- ---------------------------------------------- -->
        <section id="seccion-mineria" class="tarjeta">
            <h2>Minería de Repositorios</h2>

            <div class="controles">
                <button id="btn-run-mineria" class="boton boton-primario">
                    Correr minería
                </button>
                <span id="estado-mineria" class="etiqueta-estado">
                    Sin iniciar
                </span>
            </div>

            <div id="contenido-mineria" class="contenido-datos">
                <p class="texto-ayuda">Cargando datos...</p>
            </div>
        </section>

        <!-- ---------------------------------------------- -->
        <!-- SECCION DE TANIA (Métricas) - tu la vas a llenar -->
        <!-- ---------------------------------------------- -->
        <section id="seccion-metricas" class="tarjeta">
            <h2>Extracción de Métricas</h2>

            <div class="controles">
                <button id="btn-run-metricas" class="boton boton-primario">
                    Correr análisis de métricas
                </button>
                <span id="estado-metricas" class="etiqueta-estado">
                    Sin iniciar
                </span>
            </div>

            <div id="contenido-metricas" class="contenido-datos">
                <p class="texto-ayuda">Cargando datos...</p>
            </div>
        </section>

    </main>

    <!-- ============================================= -->
    <!-- PIE DE PAGINA                                  -->
    <!-- ============================================= -->
    <footer class="pie-pagina">
        <p>Proyecto de tesis — SD-java-metrics-extractor + framework de minería</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
